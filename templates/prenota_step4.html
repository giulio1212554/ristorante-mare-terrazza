<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Scegli il Tavolo – Mare&Terrazza</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="page">

<header class="nav">
    <div class="nav-logo">MARE<span>&</span>TERRAZZA</div>
    <nav class="nav-links">
        <a href="/">Home</a>
        <a href="/menu">Menù</a>
    </nav>
</header>

<section class="section" style="max-width:600px; margin:auto;">
    <h2>Scegli il Tavolo</h2>

    <form action="/prenota/step5" method="POST">

        <input type="hidden" name="day" value="{{ day }}">
        <input type="hidden" name="time" value="{{ time }}">
        <input type="hidden" name="people" value="{{ people }}">
        <input type="hidden" name="age_group" value="{{ age_group }}">
        <input type="hidden" name="antipasto" value="{{ antipasto }}">
        <input type="hidden" id="table_number" name="table_number">

        <div class="tables-grid">
            {% for table in range(1, 11) %}
                {% if table in occupied_tables %}
                    <button class="table-btn occupied" disabled>
                        Tavolo {{ table }} (Occupato)
                    </button>
                {% else %}
                    <button type="button" class="table-btn" onclick="selectTable({{ table }})">
                        Tavolo {{ table }}
                    </button>
                {% endif %}
            {% endfor %}
        </div>

        <button class="btn btn-primary" style="margin-top:20px;">
            Conferma Tavolo
        </button>

    </form>
</section>

</div>

<script>
function selectTable(num) {
    document.getElementById("table_number").value = num;
}
</script>

</body>
</html>
