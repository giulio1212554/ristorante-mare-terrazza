<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Prenota – Data, posizione, tavolo</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="page">
    <header class="nav">
        <div class="nav-logo">
            MARE<span>&</span>TERRAZZA
        </div>
        <nav class="nav-links">
            <a href="/">Home</a>
        </nav>
    </header>

    <section class="section">
        <h2>Data, ora, posizione e tavolo</h2>
        <form method="POST">
            <input type="date" name="day" required style="padding:8px; border-radius:8px; border:none;"><br><br>
            <input type="time" name="time" required style="padding:8px; border-radius:8px; border:none;"><br><br>
            <select name="area" required style="padding:8px; border-radius:8px; border:none;">
                <option value="terrazza">Terrazza</option>
                <option value="mare">Vicino al mare</option>
                <option value="interno">Sala interna</option>
            </select><br><br>
            <select name="table_number" required style="padding:8px; border-radius:8px; border:none;">
                {% for n in range(1, total_tables+1) %}
                <option value="{{ n }}">Tavolo {{ n }}</option>
                {% endfor %}
            </select><br><br>
            <button type="submit" class="btn btn-primary">Avanti</button>
        </form>
    </section>
</div>
</body>
</html>
