<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Prenota – Acqua</title>

</head>
<body>
<div class="page">
    <header class="nav">
        <div class="nav-logo">
            MARE<span>&</span>TERRAZZA

            <a href="/">Home</a>
        </nav>
    </header>

    <section class="section">
        <h2>Che acqua vuoi sul tavolo?</h2>
        <form method="POST">
            <select name="water" required style="padding:8px; border-radius:8px; border:none;">

        </form>
    </section>
</div>
